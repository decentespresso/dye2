name: Build and Release Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dye2-plugin/package-lock.json

      # The COMMITTED version is the source of truth; the tag only has to agree with it.
      # CI used to patch the version in from the tag, which left main behind every release
      # and needed a hand catch-up commit afterwards (Decaid installs from main and the
      # dist branch and rejects a downgrade, so main lagging is a real bug, and it was
      # silently missed at v0.1.25). Bump the four files in the release commit instead and
      # let this step fail the release when they disagree.
      #
      # The four: manifest.src.json (vite copies it to the output as manifest.json),
      # the committed build's manifest.json, and package.json / package-lock.json -- the
      # middleware reads the version from package.json to show it on the dashboard.
      - name: Check the committed versions agree
        run: |
          set -euo pipefail
          src="$(jq -r '.version' dye2-plugin/manifest.src.json)"
          built="$(jq -r '.version' dye2.reaplugin/manifest.json)"
          pkg="$(jq -r '.version' dye2-plugin/package.json)"
          lock="$(jq -r '.version' dye2-plugin/package-lock.json)"
          echo "manifest.src=$src built=$built package=$pkg lock=$lock"
          for v in "$built" "$pkg" "$lock"; do
            if [[ "$v" != "$src" ]]; then
              echo "::error::version mismatch -- manifest.src.json is $src but found $v." \
                   "Run: cd dye2-plugin && npm version --no-git-tag-version X.Y.Z," \
                   "set .version in manifest.src.json, then npm run build and commit." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$src" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the committed version $src." \
                 "Bump the version on main first, then tag that commit." >&2
            exit 1
          fi

      - name: Build
        run: npm ci && npm run build
        working-directory: dye2-plugin

      - name: Validate build output
        run: |
          set -euo pipefail
          test -s dye2.reaplugin/plugin.js
          test -s dye2.reaplugin/manifest.json
          jq -e '.id == "dye2.reaplugin"' dye2.reaplugin/manifest.json > /dev/null
          jq -e '.apiVersion and .version' dye2.reaplugin/manifest.json > /dev/null
          # The bundle must expose createPlugin for flutter_js to call.
          grep -q 'createPlugin' dye2.reaplugin/plugin.js
          echo "manifest: $(jq -c '{id,version,apiVersion}' dye2.reaplugin/manifest.json)"

      # plugin.js is committed to the repo as well, so flag when a commit shipped
      # a stale build. Warning only — the release always uses the fresh build above.
      - name: Warn if committed build is stale
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- dye2.reaplugin/; then
            echo "::warning::committed dye2.reaplugin/ differs from a clean build — run 'npm run build' in dye2-plugin and commit the result"
            git diff --stat -- dye2.reaplugin/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dye2.reaplugin
          path: dye2.reaplugin/

      # On every push to main: publish the built package to a dist branch so it
      # can be installed with install/github-branch. The branch root must be the
      # CONTENTS of dye2.reaplugin/, not the folder -- Decaid resolves exactly one
      # nested package root under GitHub's archive wrapper, so a dye2.reaplugin/
      # directory inside the branch would sit one level too deep.
      - name: Deploy plugin package to dist branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dye2.reaplugin
          publish_branch: dist
          force_orphan: true

      # Zip keeps the dye2.reaplugin/ folder as the top-level entry, because REA
      # identifies a plugin by that folder name.
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: zip -r "dye2.reaplugin-${GITHUB_REF_NAME}.zip" dye2.reaplugin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dye2.reaplugin-${{ github.ref_name }}.zip
          generate_release_notes: true
